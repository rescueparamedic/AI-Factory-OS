name: Windows Desktop Package

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OPENAI_API_KEY: ''
  AI_FACTORY_RUN_LIVE_OPENAI_TESTS: '0'

jobs:
  windows-desktop-package:
    name: Windows Desktop Package
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt
          python -m pip install pytest==9.1.1

      - name: Packaging regression
        run: >-
          python -m pytest
          tests/test_desktop_application.py
          tests/test_desktop_packaging.py
          tests/test_desktop_window.py

      - name: Build Windows Desktop
        shell: pwsh
        run: ./scripts/build_desktop_exe.ps1

      - name: Upload Windows Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Factory-Desktop-Windows
          path: dist/AI Factory Desktop
          if-no-files-found: error
          retention-days: 7
